# Copy to secret.yaml and fill it locally. This example is not applied by Kustomize.
apiVersion: v1
kind: Secret
metadata:
  name: pulse-secrets
  namespace: pulse
type: Opaque
stringData:
  PULSE_POSTGRES_URL: postgres://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/pulse?sslmode=verify-full
  # Leave BOTH values empty to disable Telegram.
  PULSE_TELEGRAM_BOT_TOKEN: ""
  PULSE_TELEGRAM_CHAT_ID: ""
