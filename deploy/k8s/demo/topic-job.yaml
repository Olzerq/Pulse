apiVersion: batch/v1
kind: Job
metadata:
  name: pulse-kafka-topic
  namespace: pulse-infra
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: create-topic
          image: apache/kafka:4.3.1
          command: [/opt/kafka/bin/kafka-topics.sh]
          args:
            - --bootstrap-server
            - kafka.pulse-infra.svc.cluster.local:9092
            - --create
            - --if-not-exists
            - --topic
            - check.result
            - --partitions
            - "3"
            - --replication-factor
            - "1"
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
