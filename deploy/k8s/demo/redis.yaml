apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pulse-infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulse-demo-redis
  template:
    metadata:
      labels:
        app: pulse-demo-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:8.10.1-alpine
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pulse-infra
spec:
  selector: {app: pulse-demo-redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
