apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-pinger
  labels:
    app.kubernetes.io/name: pulse-pinger
    app.kubernetes.io/part-of: pulse
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-pinger
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-pinger
        app.kubernetes.io/part-of: pulse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pinger
          image: pulse-pinger:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: pulse-config
          env:
            - name: PULSE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: PULSE_POSTGRES_URL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-pinger
  labels:
    app.kubernetes.io/name: pulse-pinger
    app.kubernetes.io/part-of: pulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pulse-pinger
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
