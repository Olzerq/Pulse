apiVersion: batch/v1
kind: Job
metadata:
  name: pulse-migrate
  labels:
    app.kubernetes.io/name: pulse-migrate
    app.kubernetes.io/part-of: pulse
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-migrate
        app.kubernetes.io/part-of: pulse
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: pulse-migrate:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pulse-config
          env:
            - name: PULSE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: pulse-secrets
                  key: PULSE_POSTGRES_URL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
