apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-config
data:
  PULSE_ENV: kubernetes
  PULSE_LOG_LEVEL: info
  PULSE_HTTP_ADDR: ":8080"
  PULSE_OBSERVABILITY_ADDR: ":9090"
  PULSE_SHUTDOWN_TIMEOUT: 10s
  PULSE_HEALTH_CHECK_TIMEOUT: 2s
  # Replace these with addresses reachable from your cluster.
  PULSE_REDIS_ADDR: redis.pulse-infra.svc.cluster.local:6379
  PULSE_REDIS_OPERATION_TIMEOUT: 2s
  PULSE_KAFKA_BROKERS: kafka.pulse-infra.svc.cluster.local:9092
  PULSE_KAFKA_CHECK_RESULTS_TOPIC: check.result
  PULSE_KAFKA_PUBLISH_TIMEOUT: 10s
  PULSE_KAFKA_CONSUMER_GROUP: pulse-consumer
  PULSE_CONSUMER_PROCESS_TIMEOUT: 10s
  PULSE_PINGER_POLL_INTERVAL: 1s
  PULSE_PINGER_MAX_CONCURRENCY: "20"
  PULSE_PINGER_USER_AGENT: Pulse/0.1
  PULSE_PINGER_LOCK_GRACE: 5s
  PULSE_TELEGRAM_API_URL: https://api.telegram.org
  PULSE_TELEGRAM_REQUEST_TIMEOUT: 10s
