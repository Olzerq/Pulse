global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pulse-api
    static_configs:
      - targets: ["api:8080"]

  - job_name: pulse-pinger
    dns_sd_configs:
      - names: ["pinger"]
        type: A
        port: 9090
        refresh_interval: 5s

  - job_name: pulse-consumer
    static_configs:
      - targets: ["consumer:9090"]
